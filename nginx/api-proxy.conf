# Included in the default server block of the UBI nginx image.
# Forwards API calls to the Spring Boot backend Service (ocphelloworld) in the
# same project, so the browser only ever talks to this origin (no CORS needed).
location /api/ {
    proxy_pass http://loan-management-system:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
